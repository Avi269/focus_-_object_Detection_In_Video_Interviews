services:
  - type: web
    name: proctoring-system
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn proctoring_system.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: proctoring-db
          property: connectionString

databases:
  - name: proctoring-db
    databaseName: proctoring_system
    user: proctoring_system